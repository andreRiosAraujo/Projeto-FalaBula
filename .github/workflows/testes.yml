name: Testes do FalaBula

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regressao:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar sintaxe
        run: python -m compileall -q app.py frontend.py falabula_core.py
      - name: Executar testes do catálogo
        run: python -m unittest discover -s tests -v
